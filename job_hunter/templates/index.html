<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Hunter - F1 Student Dashboard</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='dashboard.css') }}">
</head>
<body>

<div class="loading-bar" id="loadingBar"></div>

<header>
    <div class="logo">
        <h1>Job Hunter</h1>
        <span>F1 Student | New Grad & Entry-Level</span>
    </div>
    {% set active_page = "all" %}{% include "_nav.html" %}
    <div class="header-actions">
        <span class="last-scan" id="lastScan">Last scan: never</span>
        <button class="btn btn-export" onclick="exportCSV()">Export CSV</button>
        <button class="btn btn-primary" id="refreshBtn" onclick="refresh()">
            <span class="spinner"></span>
            <span class="btn-text">Refresh Jobs</span>
        </button>
    </div>
</header>

<div class="stats" id="statsContainer">
    <div class="stat-card info">
        <div class="number" id="statTotal">--</div>
        <div class="label">Total Jobs</div>
    </div>
    <div class="stat-card highlight">
        <div class="number" id="statNew">--</div>
        <div class="label">New</div>
    </div>
    <div class="stat-card" style="">
        <div class="number" id="statH1b" style="color: #64ffda;">--</div>
        <div class="label">F1 / H1B Friendly</div>
    </div>
    <div class="stat-card warning">
        <div class="number" id="statApplied">--</div>
        <div class="label">Applied</div>
    </div>
</div>

<div class="toolbar">
    <div class="filters">
        <button class="filter-btn active" data-filter="all">All Jobs</button>
        <button class="filter-btn" data-filter="new">New</button>
        <button class="filter-btn" data-filter="h1b">H1B Friendly</button>
        <button class="filter-btn" data-filter="fulltime">Full-Time Entry</button>
    </div>
    <div class="filters filters-age">
        <span class="filter-label">Posted</span>
        <button class="age-btn active" data-age="0">Any time</button>
        <button class="age-btn" data-age="24">Last 24h</button>
        <button class="age-btn" data-age="168">Last 7 days</button>
    </div>
    <div class="search-box">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/>
        </svg>
        <input type="text" id="searchInput" placeholder="Search title, company, location...">
    </div>
</div>

<div class="table-container">
    <table>
        <thead>
            <tr>
                <th data-sort="title">Title</th>
                <th data-sort="company">Company</th>
                <th data-sort="location">Location</th>
                <th data-sort="source">Source</th>
                <th data-sort="sponsorship_status">Sponsorship</th>
                <th data-sort="date_posted">Posted</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody id="jobsBody">
        </tbody>
    </table>
</div>

<div class="toast" id="toast"></div>

<script>
    let allJobs = [];
    let currentFilter = "all";
    let currentSearch = "";
    let currentMaxAge = 0;   // hours; 0 = any time
    let lastScanIso = null;
    let sortField = "date_posted";
    let sortDir = -1; // descending (newest first)

    // ---- API calls ----
    async function fetchJobs(filter = "all", search = "", maxAgeHours = 0) {
        const params = new URLSearchParams({ filter, search, max_age_hours: maxAgeHours });
        const resp = await fetch(`/api/jobs?${params}`);
        return resp.json();
    }

    async function fetchStats() {
        const resp = await fetch("/api/stats");
        return resp.json();
    }

    // ---- Render ----
    function renderStats(stats) {
        document.getElementById("statTotal").textContent = stats.total;
        document.getElementById("statNew").textContent = stats.new;
        document.getElementById("statH1b").textContent = stats.h1b_friendly;
        document.getElementById("statApplied").textContent = stats.applied;
        lastScanIso = stats.last_scan || null;

        const parts = [
            stats.last_scan
                ? `Last scan: ${fmtWhen(new Date(stats.last_scan))}`
                : "Last scan: never",
        ];
        if (stats.scan_running) {
            parts.push("scanning now...");
        } else if (stats.next_scan) {
            parts.push(`next auto-refresh ${fmtWhen(new Date(stats.next_scan))}`);
        }
        document.getElementById("lastScan").textContent = parts.join("  |  ");
    }

    // Time-only for today, date + time for anything older.
    function fmtWhen(d) {
        const sameDay = d.toDateString() === new Date().toDateString();
        const time = { hour: "2-digit", minute: "2-digit" };
        return sameDay
            ? d.toLocaleTimeString([], time)
            : d.toLocaleString([], { month: "short", day: "numeric", ...time });
    }

    function sponsorBadge(status, job) {
        // Hover shows why: the USCIS approval count, or the phrase in the
        // posting that decided it.
        const why = (job && job.sponsorship_reason) ? ` title="${escAttr(job.sponsorship_reason)}"` : "";
        const approvals = job && job.h1b_approvals;
        const count = approvals
            ? ` <span class="badge-count">${approvals.toLocaleString()}</span>`
            : "";
        if (status === "likely")
            return `<span class="badge badge-h1b"${why}>F1 Friendly${count}</span>`;
        if (status === "unlikely")
            return `<span class="badge badge-unlikely"${why}>No Sponsor</span>`;
        return `<span class="badge badge-unknown"${why}>Unknown</span>`;
    }

    function sourceBadge(source) {
        const cls = `badge-${source}`;
        const name = source.charAt(0).toUpperCase() + source.slice(1);
        return `<span class="badge badge-source ${cls}">${name}</span>`;
    }

    function formatDate(iso) {
        if (!iso) return "";
        const d = new Date(iso);
        return d.toLocaleDateString("en-US", { month: "short", day: "numeric" })
            + " " + d.toLocaleTimeString("en-US", { hour: "2-digit", minute: "2-digit" });
    }

    function getJobTypeBadge(job) {
        const tags = job.tags || "";
        if (tags.includes("entry-level")) {
            return '<span class="badge badge-newgrad">New Grad / Entry</span>';
        }
        if (tags.includes("full-time")) {
            return '<span class="badge badge-fulltime">Full-Time</span>';
        }
        return '';
    }

    function renderJobs(jobs) {
        const tbody = document.getElementById("jobsBody");

        if (!jobs.length) {
            // An age filter can legitimately return nothing when the last scan
            // is older than the window — say so, rather than looking broken.
            let hint = "Try a different filter or click Refresh to scan for new listings.";
            if (currentMaxAge && lastScanIso) {
                const scanAgeH = (Date.now() - new Date(lastScanIso)) / 3.6e6;
                if (scanAgeH > currentMaxAge) {
                    const label = currentMaxAge === 24 ? "24 hours" : `${currentMaxAge / 24} days`;
                    hint = `The last scan was ${Math.round(scanAgeH)}h ago, `
                         + `so nothing can be newer than ${label}. Click Refresh to scan now.`;
                }
            }
            tbody.innerHTML = `
                <tr><td colspan="7">
                    <div class="empty">
                        <h3>No jobs found</h3>
                        <p>${escHtml(hint)}</p>
                    </div>
                </td></tr>`;
            return;
        }

        tbody.innerHTML = jobs.map(job => {
            const url = job.url
                ? `<a href="${job.url}" target="_blank" rel="noopener">${escHtml(job.title)}</a>`
                : escHtml(job.title);
            const typeBadge = getJobTypeBadge(job);
            const appliedCls = job.applied ? "applied" : "";
            const appliedTxt = job.applied ? "Applied" : "Mark Applied";

            return `<tr>
                <td class="job-title">${url}${typeBadge}</td>
                <td class="company">${escHtml(job.company)}</td>
                <td class="location">${escHtml(job.location)}</td>
                <td>${sourceBadge(job.source)}</td>
                <td>${sponsorBadge(job.sponsorship_status, job)}</td>
                <td class="date">${formatDate(job.date_posted || job.first_seen)}</td>
                <td>
                    <div class="row-actions">
                        <button class="row-btn ${appliedCls}"
                            onclick="markApplied('${job.id}', this)">${appliedTxt}</button>
                    </div>
                </td>
            </tr>`;
        }).join("");
    }

    function escHtml(s) {
        if (!s) return "";
        const div = document.createElement("div");
        div.textContent = s;
        return div.innerHTML;
    }

    // escHtml leaves quotes alone, which is fine in element text but breaks
    // out of a quoted attribute. Use this for title="..." and friends.
    function escAttr(s) {
        return escHtml(s).replace(/"/g, "&quot;").replace(/'/g, "&#39;");
    }

    // ---- Sorting ----
    function sortJobs(jobs, field, dir) {
        return [...jobs].sort((a, b) => {
            let va = (a[field] || "").toString().toLowerCase();
            let vb = (b[field] || "").toString().toLowerCase();
            if (va < vb) return -1 * dir;
            if (va > vb) return 1 * dir;
            return 0;
        });
    }

    // ---- Load & refresh ----
    async function loadAll() {
        const [jobs, stats] = await Promise.all([
            fetchJobs(currentFilter, currentSearch, currentMaxAge),
            fetchStats(),
        ]);
        allJobs = jobs;
        renderStats(stats);
        const sorted = sortJobs(allJobs, sortField, sortDir);
        renderJobs(sorted);
    }

    async function refresh() {
        const btn = document.getElementById("refreshBtn");
        const bar = document.getElementById("loadingBar");
        manualScan = true;
        btn.classList.add("loading");
        btn.disabled = true;
        bar.classList.add("active");

        await fetch("/api/refresh", { method: "POST" });
        showToast("Scanning job boards... this takes ~1 minute");

        // Poll until scan finishes
        const poll = setInterval(async () => {
            const stats = await fetchStats();
            if (!stats.scan_running) {
                clearInterval(poll);
                btn.classList.remove("loading");
                btn.disabled = false;
                bar.classList.remove("active");
                manualScan = false;
                scanWasRunning = false;
                await loadAll();
                showToast(`Scan complete! ${stats.last_new_count} new jobs found.`);
            }
        }, 3000);
    }

    // ---- Background auto-refresh ----
    // The server rescans every hour on its own. Watch for those scans so the
    // table updates without the user pressing Refresh.
    let manualScan = false;
    let scanWasRunning = false;

    async function pollBackgroundScan() {
        if (manualScan) return;  // the manual refresh poller owns the UI
        const stats = await fetchStats();
        renderStats(stats);

        const bar = document.getElementById("loadingBar");
        if (stats.scan_running) {
            scanWasRunning = true;
            bar.classList.add("active");
        } else if (scanWasRunning) {
            scanWasRunning = false;
            bar.classList.remove("active");
            await loadAll();
            showToast(`Auto-refresh complete — ${stats.last_new_count} new jobs found.`);
        }
    }

    setInterval(pollBackgroundScan, 30000);

    async function markApplied(jobId, el) {
        await fetch("/api/mark", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ id: jobId, action: "applied" }),
        });
        el.textContent = "Applied";
        el.classList.add("applied");
        const stats = await fetchStats();
        renderStats(stats);
        showToast("Marked as applied!");
    }

    function exportCSV() {
        if (!allJobs.length) return;
        const headers = ["title", "company", "location", "source", "url", "sponsorship_status", "first_seen"];
        const rows = allJobs.map(j => headers.map(h => `"${(j[h] || "").replace(/"/g, '""')}"`).join(","));
        const csv = [headers.join(","), ...rows].join("\n");
        const blob = new Blob([csv], { type: "text/csv" });
        const a = document.createElement("a");
        a.href = URL.createObjectURL(blob);
        a.download = `jobs_${new Date().toISOString().slice(0, 10)}.csv`;
        a.click();
    }

    function showToast(msg) {
        const t = document.getElementById("toast");
        t.textContent = msg;
        t.classList.add("show");
        setTimeout(() => t.classList.remove("show"), 4000);
    }

    // ---- Event listeners ----

    // Filter buttons
    document.querySelectorAll(".filter-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".filter-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentFilter = btn.dataset.filter;
            loadAll();
        });
    });

    // Age filter — independent of the buttons above, so the two combine.
    document.querySelectorAll(".age-btn").forEach(btn => {
        btn.addEventListener("click", () => {
            document.querySelectorAll(".age-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            currentMaxAge = Number(btn.dataset.age);
            loadAll();
        });
    });

    // Search
    let searchTimer;
    document.getElementById("searchInput").addEventListener("input", (e) => {
        clearTimeout(searchTimer);
        searchTimer = setTimeout(() => {
            currentSearch = e.target.value;
            loadAll();
        }, 300);
    });

    // Column sorting
    function updateSortIndicators() {
        document.querySelectorAll("thead th[data-sort]").forEach(h => {
            h.classList.remove("sort-asc", "sort-desc");
            if (h.dataset.sort === sortField) {
                h.classList.add(sortDir === 1 ? "sort-asc" : "sort-desc");
            }
        });
    }

    document.querySelectorAll("thead th[data-sort]").forEach(th => {
        th.addEventListener("click", () => {
            const field = th.dataset.sort;
            if (sortField === field) {
                sortDir *= -1;
            } else {
                sortField = field;
                sortDir = field === "date_posted" ? -1 : 1; // dates default newest first
            }
            updateSortIndicators();
            const sorted = sortJobs(allJobs, sortField, sortDir);
            renderJobs(sorted);
        });
    });

    // Initial load
    updateSortIndicators();
    loadAll();
</script>

</body>
</html>
